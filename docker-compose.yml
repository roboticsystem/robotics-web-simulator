services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SENSOR_WS_URL: ${VITE_SENSOR_WS_URL}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 3001
    restart: unless-stopped
    expose:
      - "3001"
